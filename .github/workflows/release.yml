name: release

# A pushed v* tag builds every target, verifies the archives on real Linux and
# macOS machines, and only then publishes the GitHub release. Run it by hand
# (Actions > release > Run workflow) for a dry run: everything but the publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to stamp into the dry-run build"
        default: "v0.0.0-dryrun"

# Read-only everywhere but the publish job, which alone writes the release.
permissions:
  contents: read

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/package.sh "$VERSION" dist
      # darwin/amd64 has no runner below to execute it on; check it is the
      # right kind of binary at least.
      - run: |
          tar -xzf dist/firetower-darwin-amd64.tar.gz -C /tmp
          file /tmp/firetower-darwin-amd64/build/firetower | tee /dev/stderr | grep -q 'Mach-O 64-bit x86_64'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    needs: package
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-latest, platform: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: checksums
        run: cd dist && { sha256sum -c SHA256SUMS 2>/dev/null || shasum -a 256 -c SHA256SUMS; }
      - name: the archive's own binary, at the right version
        run: |
          tar -xzf dist/firetower-${{ matrix.platform }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/firetower-${{ matrix.platform }}/build/firetower" version | tee /dev/stderr | grep -qF "$VERSION"
      - name: the conformance suite, against the released binary
        run: FIRETOWER_BIN="$RUNNER_TEMP/firetower-${{ matrix.platform }}/build/firetower" python -m unittest discover -v -s tests
      # The one-liner, end to end, from these archives: download, checksum,
      # unpack, install, report, read it back, uninstall.
      - name: install the way a person does
        run: |
          mkdir -p "$RUNNER_TEMP/releases/latest/download"
          cp dist/* "$RUNNER_TEMP/releases/latest/download/"
          export FIRETOWER_RELEASES="file://$RUNNER_TEMP/releases"
          bash -s -- --no-claude < install.sh
          ~/.local/bin/firetower version | grep -qF "$VERSION"
          ~/.local/bin/firetower set release-smoke green "installed"
          ~/.local/bin/firetower ls | grep -q release-smoke
          ~/.local/bin/firetower rm release-smoke
          # Up to date against these very archives: --check exits 0.
          ~/.local/bin/firetower upgrade --check

  publish:
    needs: verify
    # Only a pushed tag publishes; a run by hand is a dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre=--prerelease ;; esac
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "The Firetower $VERSION" --generate-notes $pre
